name: Publish to MCP Registry (.mcpb)

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mcp-publisher github-oidc 인증
      contents: write   # GitHub Release 생성/업로드
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build .mcpb (manifest 패키징)
        run: npx -y @anthropic-ai/mcpb@latest pack mcpb nl-openapi-mcp.mcpb

      - name: Compute sha256 -> server.json 주입
        run: |
          SHA=$(sha256sum nl-openapi-mcp.mcpb | cut -d' ' -f1)
          echo "sha256=$SHA"
          sed -i "s/__MCPB_SHA256__/$SHA/" server.json

      - name: GitHub Release 생성 + .mcpb 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" nl-openapi-mcp.mcpb \
            --title "${{ github.ref_name }}" \
            --notes "National Library Seoji OpenAPI MCP ${{ github.ref_name }} — Claude Desktop .mcpb bundle"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
